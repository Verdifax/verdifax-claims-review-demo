# Keeps the four programs' dependencies and the pinned GitHub Actions SHAs
# current. Every ecosystem is checked monthly, and its minor and patch
# updates come as one grouped pull request once each release is at least 14
# days old. Major versions are not proposed as version updates: they change
# behavior and are migrated deliberately. Nothing is published from this
# repository, so .github/workflows/dependabot-merge.yml merges every passing
# group. Verdifax's review replay fails on any open Dependabot alert and on
# any Dependabot pull request open for more than 14 days.
version: 2
updates:
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      pip:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /node
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      gomod:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
