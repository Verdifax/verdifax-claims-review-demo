# Continuous integration for the claims review demo. Each language's program
# is compiled or parsed and its unit tests run: canonical JSON, the rule set
# hash, the classification line and the parity copy. The end-to-end check
# against a Verdifax server runs in Verdifax's own interop and readiness
# checks, which need an account.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    # A hung job fails here, not at GitHub's default limit: about three times
    # its longest recent run (0.4 min) (round 57).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r python/requirements.txt
      - run: python -m py_compile python/claims_review.py
      - run: python -m unittest discover -s python -p "test_*.py" -v
  node:
    runs-on: ubuntu-latest
    # A hung job fails here, not at GitHub's default limit: about three times
    # its longest recent run (0.2 min) (round 57).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci
        working-directory: node
      - run: node --check claims-review.mjs
        working-directory: node
      - run: node --test
        working-directory: node
  go:
    runs-on: ubuntu-latest
    # A hung job fails here, not at GitHub's default limit: about three times
    # its longest recent run (1.1 min) (round 57).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache-dependency-path: go/go.sum
      - run: go vet ./...
        working-directory: go
      - run: go test -count=1 ./...
        working-directory: go
  r:
    # The release the dated snapshot's packages are built for (noble).
    runs-on: ubuntu-24.04
    # A hung job fails here, not at GitHub's default limit: about three times
    # its longest recent run (0.8 min) (round 57).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: "4.5"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libsodium-dev libcurl4-openssl-dev libssl-dev
      # Packages from the same dated snapshot the R SDK's CI and Verdifax's
      # readiness check use, so every build installs the same versions.
      - run: Rscript -e 'options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/2026-10-25")); install.packages(c("jsonlite", "openssl", "httr2", "sodium"))'
      # The verdifax R SDK at the release the demo is written against; the
      # tag is held equal to the SDK's version by Verdifax's checks (R139).
      - run: curl -sSL -o verdifax-sdk-r.tar.gz https://github.com/Verdifax/verdifax-sdk-r/archive/refs/tags/v1.15.0.tar.gz && tar xzf verdifax-sdk-r.tar.gz && R CMD INSTALL verdifax-sdk-r-1.15.0
      - run: Rscript -e 'invisible(parse("r/claims-review.R"))'
      - run: Rscript r/test-claims-review.R
